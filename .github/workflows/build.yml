name: Build ApplePlay

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  apk:
    name: Android app
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Get the receiver engine and its libraries
        run: git submodule update --init --recursive --depth 1

      - name: Free disk space for the native build
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Signs every build with the same key so new versions install over old ones.
      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No signing key secrets, so this build uses a throwaway key and won't update an installed copy."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/appleplay.keystore"
          echo "APPLEPLAY_KEYSTORE_FILE=$RUNNER_TEMP/appleplay.keystore" >> "$GITHUB_ENV"
          echo "APPLEPLAY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ApplePlay-$version.apk"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/appleplay.keystore"

      - uses: actions/upload-artifact@v7
        with:
          name: ApplePlay-apk
          path: dist/*.apk
          if-no-files-found: error
